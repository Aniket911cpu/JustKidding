<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Funny Popup</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <img id="funnyGif" src="https://media.giphy.com/media/3oEjI6SIIHBdRxXI40/giphy.gif" alt="Funny GIF">
    <p id="joke">Loading joke...</p>
    <div class="buttons">
      <button id="prevJokeButton">Previous Joke</button>
      <button id="nextJokeButton">Next Joke</button>
    </div>
    <button id="addJokeButton">Add Own Joke</button>
    <button id="laughButton">Laugh</button>
  </div>
  <audio id="laughSound" src="laugh.mp3"></audio>
  <script src="popup.js"></script>
</body>
</html>
